<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jadwal Kegiatan Kabid Bina Marga</title>
<meta name="theme-color" content="#1e3a5f">

<!-- ============ STYLE ============ -->
<style>
  /* ===== RESET & VARIABLES ===== */
  :root {
    --navy: #1e3a5f;
    --navy-dark: #132a45;
    --blue: #2f6fed;
    --blue-light: #e8f0fe;
    --bg: #f4f6fa;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --green: #16a34a;
    --amber: #d97706;
    --red: #dc2626;
    --radius: 14px;
    --shadow: 0 4px 16px rgba(30,58,95,0.08);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-top: var(--safe-top);
    padding-bottom: var(--safe-bottom);
  }

  /* ===== HEADER ===== */
  header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%);
    color: #fff;
    padding: 22px 24px 18px;
    box-shadow: var(--shadow);
    position: sticky;
    top: 0;
    z-index: 30;
  }
  header .header-inner {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 19px; font-weight: 700; letter-spacing: .3px; display: flex; align-items: center; gap: 8px; }
  header p { font-size: 12.5px; opacity: .85; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .install-btn {
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    display: none;
    align-items: center;
    gap: 6px;
    transition: .2s;
  }
  .install-btn:hover { background: rgba(255,255,255,0.3); }
  .install-btn.show { display: inline-flex; }
  .user-chip {
    font-size: 12px;
    font-weight: 600;
    background: rgba(255,255,255,0.15);
    padding: 6px 12px;
    border-radius: 20px;
  }
  .logout-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.15);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    transition: .2s;
  }
  .logout-btn:hover { background: rgba(255,255,255,0.3); }

  /* ===== LOGIN SCREEN ===== */
  .login-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 500;
  }
  .login-box {
    background: #fff;
    border-radius: var(--radius);
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
    padding: 32px 26px;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  .login-logo { font-size: 40px; margin-bottom: 6px; }
  .login-box h1 { font-size: 18px; color: var(--navy-dark); margin-bottom: 2px; }
  .login-box p { font-size: 12.5px; color: var(--muted); margin-bottom: 20px; }
  .login-box .field { text-align: left; margin-bottom: 12px; }
  .login-msg {
    font-size: 12.5px;
    color: var(--red);
    margin-top: 10px;
    min-height: 16px;
  }

  /* ===== TABS ===== */
  .tabs {
    display: flex;
    background: #fff;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 20;
    max-width: 960px;
    margin: 0 auto;
  }
  .tab-btn {
    flex: 1;
    padding: 14px 10px;
    text-align: center;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: .2s;
  }
  .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
  .tab-btn:active { background: var(--blue-light); }

  /* ===== CONTAINER ===== */
  .container { max-width: 960px; margin: 0 auto; padding: 18px 16px 60px; }
  .tab-content { display: none; }
  .tab-content.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== CARD ===== */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin-bottom: 14px; color: var(--navy-dark); }

  /* ===== FORM ===== */
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid .full { grid-column: 1/-1; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .field input, .field select, .field textarea {
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 9px;
    font-size: 14px;
    font-family: inherit;
    background: #fbfcfe;
    color: var(--text);
    transition: .15s;
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none;
    border-color: var(--blue);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(47,111,237,0.1);
  }
  textarea { resize: vertical; min-height: 56px; }

  /* ===== BUTTONS ===== */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 11px 18px;
    border: none;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: .15s;
  }
  .btn-primary { background: var(--blue); color: #fff; width: 100%; margin-top: 6px; }
  .btn-primary:hover { background: #2559c2; }
  .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
  .btn-danger { background: #fde8e8; color: var(--red); padding: 7px 12px; font-size: 12.5px; }
  .btn-danger:hover { background: #fcd5d5; }
  .btn-danger:disabled { opacity: .6; cursor: not-allowed; }
  .btn-secondary { background: #f1f3f6; color: var(--text); }
  .btn-secondary:hover { background: #e5e7eb; }
  .btn-success { background: var(--green); color: #fff; }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%) translateY(20px);
    background: var(--navy-dark);
    color: #fff;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 13.5px;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
    opacity: 0;
    pointer-events: none;
    transition: .25s;
    z-index: 100;
    max-width: 88%;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--red); }

  /* ===== MONTH NAV ===== */
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .month-nav .nav-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: #fff;
    font-size: 18px;
    cursor: pointer;
    color: var(--navy);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: .15s;
  }
  .month-nav .nav-btn:hover { background: var(--blue-light); }
  .month-nav .nav-btn:active { transform: scale(0.95); }
  .month-nav .month-label { font-size: 16px; font-weight: 700; color: var(--navy-dark); }

  /* ===== DAY STRIP ===== */
  .day-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 2px 12px;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
  }
  .day-strip::-webkit-scrollbar { height: 5px; }
  .day-strip::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 6px; }
  .day-chip {
    flex: 0 0 auto;
    scroll-snap-align: center;
    min-width: 52px;
    padding: 9px 4px;
    border-radius: 12px;
    background: #fff;
    border: 1.5px solid var(--border);
    text-align: center;
    cursor: pointer;
    transition: .15s;
  }
  .day-chip:hover { border-color: var(--blue); }
  .day-chip .dname { font-size: 10.5px; color: var(--muted); text-transform: uppercase; }
  .day-chip .dnum { font-size: 16px; font-weight: 700; color: var(--text); margin-top: 2px; }
  .day-chip.today { border-color: var(--blue); }
  .day-chip.today .dnum { color: var(--blue); }
  .day-chip.has-event::after {
    content: '';
    display: block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--blue);
    margin: 4px auto 0;
  }
  .day-chip.selected { background: var(--blue); border-color: var(--blue); }
  .day-chip.selected .dname, .day-chip.selected .dnum { color: #fff; }
  .day-chip.selected.has-event::after { background: #fff; }

  .selected-date-label {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--muted);
    margin: 2px 0 12px;
  }

  /* ===== EVENT CARD ===== */
  .event-card {
    background: #fff;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    border-left: 4px solid var(--blue);
    transition: .15s;
  }
  .event-card:hover { box-shadow: 0 6px 20px rgba(30,58,95,0.14); }
  .event-card.status-terjadwal { border-left-color: var(--blue); }
  .event-card.status-berlangsung { border-left-color: var(--amber); }
  .event-card.status-selesai { border-left-color: var(--green); }
  .event-card.status-ditunda { border-left-color: var(--amber); }
  .event-card.status-dibatalkan { border-left-color: var(--red); opacity: .7; }

  .event-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .event-time { font-size: 13px; font-weight: 700; color: var(--navy); }
  .event-title {
    font-size: 15px;
    font-weight: 700;
    margin: 4px 0 6px;
    color: var(--text);
    cursor: pointer;
    transition: .15s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .event-title:hover { color: var(--blue); text-decoration: underline; }
  .event-title .hint-icon { font-size: 12px; opacity: .55; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }
  .badge-terjadwal { background: #e8f0fe; color: var(--blue); }
  .badge-berlangsung { background: #fff7e0; color: var(--amber); }
  .badge-selesai { background: #e6f7ec; color: var(--green); }
  .badge-ditunda { background: #fff1e0; color: var(--amber); }
  .badge-dibatalkan { background: #fde8e8; color: var(--red); }

  .event-meta { font-size: 13px; color: var(--muted); margin: 3px 0; display: flex; gap: 6px; flex-wrap: wrap; }
  .event-meta b { color: var(--text); font-weight: 600; }
  .event-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .event-actions select {
    padding: 6px 10px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    font-size: 12.5px;
    background: #fff;
  }
  .event-actions select:focus { outline: none; border-color: var(--blue); }

  .empty-state { text-align: center; padding: 40px 10px; color: var(--muted); }
  .empty-state .icon { font-size: 34px; margin-bottom: 8px; }

  .loader { text-align: center; padding: 30px; color: var(--muted); font-size: 13.5px; }
  .spinner {
    width: 26px;
    height: 26px;
    border: 3px solid var(--border);
    border-top-color: var(--blue);
    border-radius: 50%;
    margin: 0 auto 10px;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(17,24,39,.48);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
    z-index: 200;
    padding: 0;
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }
  .modal-box {
    background: #fff;
    width: 100%;
    max-width: 520px;
    border-radius: 20px 20px 0 0;
    max-height: 88vh;
    display: flex;
    flex-direction: column;
    transform: translateY(24px);
    transition: transform .22s ease;
    box-shadow: 0 -8px 30px rgba(0,0,0,.18);
  }
  .modal-overlay.show .modal-box { transform: translateY(0); }
  @media (min-width: 560px) {
    .modal-overlay { align-items: center; }
    .modal-box { border-radius: 18px; max-height: 85vh; }
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .modal-header h3 { font-size: 16px; font-weight: 700; color: var(--navy-dark); }
  .modal-close-x {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: #f1f3f6;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: .15s;
  }
  .modal-close-x:hover { background: #e5e7eb; }
  .modal-body { padding: 18px 20px; overflow-y: auto; flex: 1; }
  .modal-footer {
    display: flex;
    gap: 10px;
    padding: 14px 20px 20px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .modal-footer .btn { flex: 1; margin-top: 0; }

  .drag-handle {
    width: 38px;
    height: 4px;
    background: var(--border);
    border-radius: 4px;
    margin: 10px auto -2px;
    flex-shrink: 0;
  }
  @media (min-width: 560px) { .drag-handle { display: none; } }

  /* ===== RESPONSIVE ===== */
  /* Tablet */
  @media (min-width: 640px) {
    header { padding: 26px 32px 20px; }
    header h1 { font-size: 21px; }
    .container { padding: 22px 20px 60px; }
    .card { padding: 24px; }
    .form-grid { grid-template-columns: repeat(3, 1fr); }
    .form-grid .full { grid-column: 1/-1; }
    .day-chip { min-width: 58px; padding: 10px 4px; }
    .event-actions select { font-size: 13px; }
  }

  /* Desktop */
  @media (min-width: 1024px) {
    body { background: linear-gradient(180deg, var(--bg) 0%, #eef1f7 100%); }
    header { padding: 30px 0; }
    header .header-inner { padding: 0 32px; }
    header h1 { font-size: 23px; }
    header p { font-size: 13.5px; }
    .tabs { border-radius: 0; }
    .tab-btn { padding: 16px 10px; font-size: 14.5px; }
    .tab-btn:hover { background: var(--blue-light); }
    .container { padding: 28px 24px 70px; }
    #tab-input .card { max-width: 820px; margin: 0 auto; padding: 32px 36px; }
    #tab-input .form-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; }
    #tab-input .form-grid .field:nth-child(5) { grid-column: 1/-1; }
    #tab-input .btn-primary { max-width: 320px; margin-left: auto; margin-right: auto; }
    #tab-jadwal .card { padding: 26px 30px; }
    .day-chip { min-width: 64px; padding: 11px 4px; }
    .event-card { padding: 18px 22px; }
    .event-title { font-size: 16px; }
    .modal-box { max-width: 600px; }
    .modal-body .form-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
    #formEdit .form-grid .field:nth-child(5) { grid-column: 1/-1; }
  }

  /* Large Desktop */
  @media (min-width: 1400px) {
    .container { max-width: 1040px; }
    #tab-input .card { max-width: 880px; }
  }

  /* Dark Mode Support */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1724;
      --card: #1a2744;
      --text: #e8edf5;
      --muted: #94a3b8;
      --border: #2a3a5c;
      --shadow: 0 4px 16px rgba(0,0,0,0.4);
      --blue-light: #1a2a4a;
    }
    .tab-btn { background: var(--card); color: var(--muted); }
    .tabs { background: var(--card); border-bottom-color: var(--border); }
    .field input, .field select, .field textarea { background: #0f1724; color: var(--text); border-color: var(--border); }
    .event-card { background: var(--card); }
    .day-chip { background: var(--card); border-color: var(--border); }
    .day-chip .dnum { color: var(--text); }
    .day-chip:hover { border-color: var(--blue); }
    .month-nav .nav-btn { background: var(--card); border-color: var(--border); color: var(--text); }
    .month-nav .nav-btn:hover { background: var(--blue-light); }
    .modal-box { background: var(--card); }
    .modal-header { border-bottom-color: var(--border); }
    .modal-footer { border-top-color: var(--border); }
    .modal-close-x { background: #2a3a5c; color: var(--text); }
    .modal-close-x:hover { background: #3a4a6c; }
    .btn-secondary { background: #2a3a5c; color: var(--text); }
    .btn-secondary:hover { background: #3a4a6c; }
    .event-actions select { background: var(--card); color: var(--text); border-color: var(--border); }
    .selected-date-label { color: var(--muted); }
    .badge-terjadwal { background: #1a2a4a; color: var(--blue); }
    .badge-berlangsung { background: #2a2a1a; color: var(--amber); }
    .badge-selesai { background: #1a2a1a; color: var(--green); }
    .badge-ditunda { background: #2a1a1a; color: var(--amber); }
    .badge-dibatalkan { background: #2a1a1a; color: var(--red); }
  }
</style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="login-logo">📋</div>
    <h1>Jadwal Kegiatan</h1>
    <p>Kepala Bidang Bina Marga</p>
    <form id="formLogin">
      <div class="field">
        <label>Username</label>
        <input type="text" id="l-username" autocomplete="username" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="l-password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" id="btnLogin">🔑 Masuk</button>
      <div class="login-msg" id="loginMsg"></div>
    </form>
  </div>
</div>

<!-- ===== APP (tersembunyi sampai login berhasil) ===== -->
<div id="appRoot" style="display:none;">

<!-- ===== HEADER ===== -->
<header>
  <div class="header-inner">
    <div>
      <h1>📋 Jadwal Kegiatan</h1>
      <p>Kepala Bidang Bina Marga</p>
    </div>
    <div class="header-right">
      <span class="user-chip" id="userChip"></span>
      <button class="logout-btn" id="logoutBtn" title="Keluar">⏻</button>
    </div>
  </div>
</header>

<!-- ===== TABS ===== -->
<div class="tabs">
  <button class="tab-btn active" data-tab="input" id="tabBtnInput">➕ Input Kegiatan</button>
  <button class="tab-btn" data-tab="jadwal">🗓️ Jadwal Kegiatan</button>
</div>

<!-- ===== CONTAINER ===== -->
<div class="container">

  <!-- TAB 1: INPUT -->
  <div class="tab-content active" id="tab-input">
    <div class="card">
      <h2>Tambah Kegiatan Baru</h2>
      <form id="formInput">
        <div class="form-grid">
          <div class="field">
            <label>Tanggal</label>
            <input type="date" id="f-tanggal" required>
          </div>
          <div class="field">
            <label>Hari</label>
            <input type="text" id="f-hari" placeholder="Otomatis" disabled>
          </div>
          <div class="field">
            <label>Jam Mulai</label>
            <input type="time" id="f-jamMulai" step="60" required>
          </div>
          <div class="field">
            <label>Jam Selesai</label>
            <input type="time" id="f-jamSelesai" step="60" required>
          </div>
          <div class="field full">
            <label>Kegiatan</label>
            <input type="text" id="f-kegiatan" placeholder="Nama / uraian kegiatan" required>
          </div>
          <div class="field">
            <label>Kategori</label>
            <select id="f-kategori">
              <option>Rapat</option>
              <option>Kunjungan Lapangan</option>
              <option>Koordinasi</option>
              <option>Sosialisasi</option>
              <option>Monitoring & Evaluasi</option>
              <option>Dinas Luar</option>
              <option>Lainnya</option>
            </select>
          </div>
          <div class="field">
            <label>Status</label>
            <select id="f-status">
              <option>Terjadwal</option>

</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

          <div class="field">

              <option>Rapat</option>

              <option>Lainnya</option>

              <option>Terjadwal</option>

            </select>
          </div>
          <div class="field full">
            <label>Lokasi</label>
            <input type="text" id="e-lokasi" placeholder="Lokasi kegiatan">
          </div>
          <div class="field full">
            <label>Dispo (Disposisi)</label>
            <input type="text" id="e-dispo" placeholder="Contoh: Didisposisikan ke Kasi ...">
          </div>

<!-- ============================================================ -->
<!-- ===== JAVASCRIPT ===== -->
<script>
// ============================================================
// KONFIGURASI
// ============================================================
// Tidak perlu API_URL -- semua panggilan ke backend memakai
// google.script.run langsung ke fungsi di Code.gs (satu project, satu deployment).

// Helper: bungkus google.script.run jadi Promise
function gsRun(fnName, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler((err) => reject(err))
      [fnName](...args);
  });
}

const HARI_NAMA = ['Minggu','Senin','Selasa','Rabu','Kamis',"Jum'at",'Sabtu'];
const BULAN_NAMA = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

let allJadwal = [];
let currentViewDate = new Date();
let selectedDate = new Date();
selectedDate.setHours(0,0,0,0);

// ============================================================
// SESI LOGIN
// ============================================================
const SESSION_KEY = 'jadwal_session';
let currentUser = null; // { username, password, role }

function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function saveSession(user) {
  currentUser = user;
  localStorage.setItem(SESSION_KEY, JSON.stringify(user));
}

function clearSession() {
  currentUser = null;
  localStorage.removeItem(SESSION_KEY);
}

// Disertakan di setiap request yang mengubah data (tambah/update/hapus/updateStatus)
function authPayload() {
  return currentUser ? { username: currentUser.username, password: currentUser.password } : {};
}

function applyRoleUI() {
  const isAdmin = currentUser && currentUser.role === 'admin';
  const tabBtnInput = document.getElementById('tabBtnInput');
  if (tabBtnInput) tabBtnInput.style.display = isAdmin ? '' : 'none';
  if (!isAdmin) {
    // Staff: paksa ke tab jadwal (read-only)
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelector('.tab-btn[data-tab="jadwal"]').classList.add('active');
    document.getElementById('tab-jadwal').classList.add('active');
  }
}

function showApp() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('appRoot').style.display = '';
  document.getElementById('userChip').textContent =
    '👤 ' + currentUser.username + ' (' + currentUser.role + ')';
  applyRoleUI();
  loadJadwal();
}

function showLogin(message) {
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('loginOverlay').style.display = 'flex';
  document.getElementById('loginMsg').textContent = message || '';
}

async function apiLogin(username, password) {
  return gsRun('login', username, password);
}

document.getElementById('formLogin').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('btnLogin');
  const msg = document.getElementById('loginMsg');
  const username = document.getElementById('l-username').value.trim();
  const password = document.getElementById('l-password').value;

  btn.disabled = true;
  btn.textContent = 'Memeriksa...';
  msg.textContent = '';

  try {
    const res = await apiLogin(username, password);
    if (res.success) {
      saveSession({ username: res.username, password, role: res.role });
      document.getElementById('formLogin').reset();
      showApp();
    } else {
      msg.textContent = res.message || 'Login gagal.';
    }
  } catch (err) {
    msg.textContent = 'Gagal terhubung ke server: ' + err.message;
  }
  btn.disabled = false;
  btn.textContent = '🔑 Masuk';
});

document.getElementById('logoutBtn').addEventListener('click', function() {
  if (!confirm('Keluar dari aplikasi?')) return;
  clearSession();
  showLogin('');
});

// ============================================================
// FUNGSI BANTUAN
// ============================================================
function fmtLocal(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function showToast(msg, isErrorOrDuration) {
  const t = document.getElementById('toast');
  const isError = isErrorOrDuration === true;
  const duration = typeof isErrorOrDuration === 'number' ? isErrorOrDuration : 2600;
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(t._hide);
  t._hide = setTimeout(() => t.className = 'toast', duration);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function statusClass(status) {
  const map = {
    'Terjadwal': 'terjadwal',
    'Berlangsung': 'berlangsung',
    'Selesai': 'selesai',
    'Ditunda': 'ditunda',
    'Dibatalkan': 'dibatalkan'
  };
  return map[status] || 'terjadwal';
}

// ============================================================
// API CALLS
// ============================================================
async function apiGetJadwal() {
  return gsRun('getJadwal');
}

async function apiTambah(data) {
  return gsRun('tambahJadwal', { ...data, ...authPayload() });
}

async function apiUpdate(rowIndex, data) {
  return gsRun('updateJadwal', rowIndex, { ...data, ...authPayload() });
}

async function apiHapus(rowIndex) {
  return gsRun('hapusJadwal', rowIndex, authPayload());
}

async function apiUpdateStatus(rowIndex, status) {
  return gsRun('updateStatus', rowIndex, status, authPayload());
}

// ============================================================
// LOAD DATA
// ============================================================
async function loadJadwal() {
  const list = document.getElementById('eventsList');
  list.innerHTML = '<div class="loader"><div class="spinner"></div>Memuat jadwal...</div>';
  try {
    const data = await apiGetJadwal();
    if (data.error) {
      list.innerHTML = '<div class="empty-state">❌ Gagal memuat data: ' + data.error + '</div>';
      return;
    }
    allJadwal = data || [];
    renderMonthView();
  } catch (err) {
    list.innerHTML = '<div class="empty-state">❌ Gagal terhubung ke server: ' + err.message + '</div>';
  }
}

// ============================================================
// TABS
// ============================================================
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'jadwal') loadJadwal();
  });
});

// ============================================================
// FORM INPUT
// ============================================================
const fTanggal = document.getElementById('f-tanggal');
const fHari = document.getElementById('f-hari');
fTanggal.value = fmtLocal(new Date());

function updateHariField() {
  if (!fTanggal.value) { fHari.value = ''; return; }
  const d = new Date(fTanggal.value + 'T00:00:00');
  fHari.value = HARI_NAMA[d.getDay()];
}
updateHariField();
fTanggal.addEventListener('change', updateHariField);

document.getElementById('formInput').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('btnSimpan');
  btn.disabled = true;
  btn.textContent = 'Menyimpan...';

  const data = {
    tanggal: fTanggal.value,
    jamMulai: document.getElementById('f-jamMulai').value,
    jamSelesai: document.getElementById('f-jamSelesai').value,
    kegiatan: document.getElementById('f-kegiatan').value,
    kategori: document.getElementById('f-kategori').value,
    status: document.getElementById('f-status').value,
    lokasi: document.getElementById('f-lokasi').value,
    dispo: document.getElementById('f-dispo').value,
    catatan: document.getElementById('f-catatan').value
  };

  try {
    const res = await apiTambah(data);
    if (res.success) {
      showToast(res.message);
      document.getElementById('formInput').reset();
      fTanggal.value = fmtLocal(new Date());
      updateHariField();
      allJadwal = [];
    } else {
      showToast(res.message, true);
    }
  } catch (err) {
    showToast('Terjadi kesalahan: ' + err.message, true);
  }
  btn.disabled = false;
  btn.textContent = '💾 Simpan Kegiatan';
});

// ============================================================
// RENDER JADWAL
// ============================================================
document.getElementById('prevMonth').addEventListener('click', () => {
  currentViewDate.setMonth(currentViewDate.getMonth() - 1);
  renderMonthView();
});
document.getElementById('nextMonth').addEventListener('click', () => {
  currentViewDate.setMonth(currentViewDate.getMonth() + 1);
  renderMonthView();
});

function renderMonthView() {
  document.getElementById('monthLabel').textContent =
    BULAN_NAMA[currentViewDate.getMonth()] + ' ' + currentViewDate.getFullYear();

  const year = currentViewDate.getFullYear();
  const month = currentViewDate.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const eventDatesSet = new Set(allJadwal.map(j => j.tanggal));
  const todayStr = fmtLocal(new Date());

  const strip = document.getElementById('dayStrip');
  strip.innerHTML = '';
  let selectedChip = null;

  for (let d = 1; d <= daysInMonth; d++) {
    const dateObj = new Date(year, month, d);
    const dateStr = fmtLocal(dateObj);
    const chip = document.createElement('div');
    chip.className = 'day-chip';
    if (dateStr === todayStr) chip.classList.add('today');
    if (eventDatesSet.has(dateStr)) chip.classList.add('has-event');
    if (dateStr === fmtLocal(selectedDate)) chip.classList.add('selected');

    chip.innerHTML = `<div class="dname">${HARI_NAMA[dateObj.getDay()].slice(0, 3)}</div><div class="dnum">${d}</div>`;
    chip.addEventListener('click', () => {
      selectedDate = dateObj;
      renderMonthView();
    });
    strip.appendChild(chip);
    if (dateStr === fmtLocal(selectedDate)) selectedChip = chip;
  }

  renderEventsForSelectedDate();

  setTimeout(() => {
    if (selectedChip) selectedChip.scrollIntoView({ inline: 'center', behavior: 'smooth', block: 'nearest' });
  }, 50);
}

function renderEventsForSelectedDate() {
  const dateStr = fmtLocal(selectedDate);
  const label = document.getElementById('selectedDateLabel');
  const isToday = dateStr === fmtLocal(new Date());
  label.textContent = (isToday ? 'Hari ini • ' : '') + HARI_NAMA[selectedDate.getDay()] + ', ' +
    selectedDate.getDate() + ' ' + BULAN_NAMA[selectedDate.getMonth()] + ' ' + selectedDate.getFullYear();

  const items = allJadwal
    .filter(j => j.tanggal === dateStr)
    .sort((a, b) => (a.jamMulai || '').localeCompare(b.jamMulai || ''));

  const list = document.getElementById('eventsList');

  if (items.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">🗒️</div>Tidak ada kegiatan pada tanggal ini.</div>`;
    return;
  }

  list.innerHTML = items.map(renderEventCard).join('');

  // Event listener untuk edit
  list.querySelectorAll('[data-view-row]').forEach(titleEl => {
    titleEl.addEventListener('click', function() {
      openEditModal(this.getAttribute('data-view-row'));
    });
  });

  // Event listener untuk update status
  list.querySelectorAll('[data-status-row]').forEach(sel => {
    sel.addEventListener('change', async function() {
      const rowIndex = this.getAttribute('data-status-row');
      this.disabled = true;
      try {
        const res = await apiUpdateStatus(rowIndex, this.value);
        if (res.success) {
          showToast('Status diperbarui');
          const idx = allJadwal.findIndex(j => j.rowIndex == rowIndex);
          if (idx > -1) allJadwal[idx].status = this.value;
          renderEventsForSelectedDate();
        } else {
          showToast(res.message || 'Gagal update status', true);
          this.disabled = false;
        }
      } catch (err) {
        showToast('Gagal update status: ' + err.message, true);
        this.disabled = false;
      }
    });
  });

  // Event listener untuk hapus
  list.querySelectorAll('[data-delete-row]').forEach(btn => {
    btn.addEventListener('click', async function() {
      const rowIndex = this.getAttribute('data-delete-row');
      if (!confirm('Hapus kegiatan ini? Baris akan dihapus permanen dari spreadsheet.')) return;
      this.disabled = true;
      this.textContent = 'Menghapus...';
      try {
        const res = await apiHapus(rowIndex);
        if (res && res.success === false) {
          this.disabled = false;
          this.textContent = '🗑️ Hapus';
          showToast(res.message || 'Gagal menghapus.', true);
          return;
        }
        showToast('Kegiatan berhasil dihapus');
        await loadJadwal();
      } catch (err) {
        this.disabled = false;
        this.textContent = '🗑️ Hapus';
        showToast('Gagal menghapus: ' + err.message, true);
      }
    });
  });
}

function renderEventCard(j) {
  const sc = statusClass(j.status);
  const isAdmin = currentUser && currentUser.role === 'admin';
  return `
  <div class="event-card status-${sc}">
    <div class="event-top">
      <div class="event-time">${j.jamMulai || '--:--'} – ${j.jamSelesai || '--:--'}</div>
      <span class="badge badge-${sc}">${j.status || 'Terjadwal'}</span>
    </div>
    <div class="event-title" data-view-row="${j.rowIndex}" title="${isAdmin ? 'Klik untuk lihat & edit detail' : 'Klik untuk lihat detail'}">
      ${escapeHtml(j.kegiatan)} <span class="hint-icon">${isAdmin ? '✎' : '👁️'}</span>
    </div>
    <div class="event-meta">🏷️ <b>${escapeHtml(j.kategori || '-')}</b></div>
    ${j.lokasi ? `<div class="event-meta">📍 ${escapeHtml(j.lokasi)}</div>` : ''}
    ${j.dispo ? `<div class="event-meta">➡️ Dispo: <b>${escapeHtml(j.dispo)}</b></div>` : ''}
    ${j.catatan ? `<div class="event-meta">📝 ${escapeHtml(j.catatan)}</div>` : ''}
    ${isAdmin ? `
    <div class="event-actions">
      <select data-status-row="${j.rowIndex}">
        ${['Terjadwal','Berlangsung','Selesai','Ditunda','Dibatalkan'].map(s => `<option ${s === j.status ? 'selected' : ''}>${s}</option>`).join('')}
      </select>
      <button type="button" class="btn btn-danger" data-delete-row="${j.rowIndex}">🗑️ Hapus</button>
    </div>` : ''}
  </div>`;
}

// ============================================================
// MODAL DETAIL / EDIT
// ============================================================
const modalOverlay = document.getElementById('modalOverlay');
const eTanggal = document.getElementById('e-tanggal');
const eHari = document.getElementById('e-hari');

function updateEHariField() {
  if (!eTanggal.value) { eHari.value = ''; return; }
  const d = new Date(eTanggal.value + 'T00:00:00');
  eHari.value = HARI_NAMA[d.getDay()];
}
eTanggal.addEventListener('change', updateEHariField);

function openEditModal(rowIndex) {
  const item = allJadwal.find(j => String(j.rowIndex) === String(rowIndex));
  if (!item) {
    showToast('Data tidak ditemukan, coba muat ulang jadwal.', true);
    return;
  }
  document.getElementById('e-rowIndex').value = item.rowIndex;
  eTanggal.value = item.tanggal || '';
  updateEHariField();
  document.getElementById('e-jamMulai').value = item.jamMulai || '';
  document.getElementById('e-jamSelesai').value = item.jamSelesai || '';
  document.getElementById('e-kegiatan').value = item.kegiatan || '';
  document.getElementById('e-kategori').value = item.kategori || 'Rapat';
  document.getElementById('e-status').value = item.status || 'Terjadwal';
  document.getElementById('e-lokasi').value = item.lokasi || '';
  document.getElementById('e-dispo').value = item.dispo || '';
  document.getElementById('e-catatan').value = item.catatan || '';

  const isAdmin = currentUser && currentUser.role === 'admin';
  const btnUpdate = document.getElementById('btnUpdateModal');
  btnUpdate.disabled = false;
  btnUpdate.textContent = '💾 Update';
  btnUpdate.style.display = isAdmin ? '' : 'none';

  document.querySelectorAll('#formEdit input, #formEdit select, #formEdit textarea')
    .forEach(el => { el.disabled = !isAdmin; });

  modalOverlay.classList.add('show');
}

function closeEditModal() {
  modalOverlay.classList.remove('show');
}

document.getElementById('modalCloseX').addEventListener('click', closeEditModal);
document.getElementById('btnTutupModal').addEventListener('click', closeEditModal);
modalOverlay.addEventListener('click', function(e) {
  if (e.target === modalOverlay) closeEditModal();
});

// Close modal dengan tombol Escape
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && modalOverlay.classList.contains('show')) {
    closeEditModal();
  }
});

document.getElementById('btnUpdateModal').addEventListener('click', async function() {
  const form = document.getElementById('formEdit');
  if (!form.reportValidity()) return;

  const rowIndex = Number(document.getElementById('e-rowIndex').value);
  const data = {
    tanggal: eTanggal.value,
    jamMulai: document.getElementById('e-jamMulai').value,
    jamSelesai: document.getElementById('e-jamSelesai').value,
    kegiatan: document.getElementById('e-kegiatan').value,
    kategori: document.getElementById('e-kategori').value,
    status: document.getElementById('e-status').value,
    lokasi: document.getElementById('e-lokasi').value,
    dispo: document.getElementById('e-dispo').value,
    catatan: document.getElementById('e-catatan').value
  };

  const btn = this;
  btn.disabled = true;
  btn.textContent = 'Menyimpan...';

  try {
    const res = await apiUpdate(rowIndex, data);
    if (res && res.success) {
      showToast(res.message || 'Kegiatan berhasil diperbarui.');
      closeEditModal();
      await loadJadwal();
    } else {
      showToast((res && res.message) || 'Gagal memperbarui kegiatan.', true);
    }
  } catch (err) {
    showToast('Terjadi kesalahan: ' + err.message, true);
  }
  btn.disabled = false;
  btn.textContent = '💾 Update';
});

// ============================================================
// INISIALISASI
// ============================================================
(function initSession() {
  const saved = loadSession();
  if (saved && saved.username && saved.password) {
    currentUser = saved;
    showApp();
  } else {
    showLogin('');
  }
})();
</script>
</body>
