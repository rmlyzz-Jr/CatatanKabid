<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jadwal Kegiatan - Kabid Bina Marga</title>

<!-- ============ PWA META TAGS ============ -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jadwal Kegiatan">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: linear-gradient(135deg, #1e3a5f 0%, #2f6fed 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    text-align: center;
  }
  .card {
    width: 100%;
    max-width: 360px;
  }
  .card img {
    width: 100px;
    height: 100px;
    border-radius: 24px;
    box-shadow: 0 12px 32px rgba(0,0,0,.28);
    margin-bottom: 22px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .2px;
    margin-bottom: 4px;
  }
  p.sub {
    font-size: 13.5px;
    opacity: .85;
    margin-bottom: 34px;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 14px 20px;
    border-radius: 26px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: .18s;
    font-family: inherit;
  }
  .btn-primary {
    background: #fff;
    color: #1e3a5f;
    box-shadow: 0 10px 26px rgba(0,0,0,.22);
    margin-bottom: 12px;
  }
  .btn-primary:hover { background: #eef1f7; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-secondary {
    background: rgba(255,255,255,0.14);
    color: #fff;
    border: 1.5px solid rgba(255,255,255,0.4);
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.24); }
  .btn-secondary:disabled {
    opacity: .55;
    cursor: default;
  }
  .status {
    font-size: 12.5px;
    opacity: .85;
    margin-top: 16px;
    min-height: 16px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="card">
  <img src="icon-512.png" alt="Jadwal Kegiatan">
  <h1>Jadwal Kegiatan</h1>
  <p class="sub">Kepala Bidang Bina Marga</p>

  <a class="btn btn-primary" id="openBtn" href="https://script.google.com/macros/s/AKfycbyd1lrkh2BYvIpRagMXvpxi8ouzgJ72IAT_oVajb9oASpqccCjdLpuObB_O5YEbbpaqLQ/exec">
    🚀 Buka Aplikasi
  </a>
  <button class="btn btn-secondary" id="installBtn">📲 Instal Aplikasi</button>

  <div class="status" id="status"></div>
</div>

<script>
// ============================================================
// KONFIGURASI — GANTI DENGAN URL WEB APP KAMU KALAU BERUBAH
// ============================================================
const APP_URL = 'https://script.google.com/macros/s/AKfycbyd1lrkh2BYvIpRagMXvpxi8ouzgJ72IAT_oVajb9oASpqccCjdLpuObB_O5YEbbpaqLQ/exec';
document.getElementById('openBtn').href = APP_URL;

// ============================================================
// TOMBOL INSTAL APLIKASI (PWA — splash ini yang jadi ikon Home Screen)
// ============================================================
let deferredPrompt;
const installBtn = document.getElementById('installBtn');
const statusEl = document.getElementById('status');

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true; // iOS Safari
}
function isIOS() {
  return /iphone|ipad|ipod/i.test(window.navigator.userAgent);
}

if (isStandalone()) {
  installBtn.style.display = 'none';
}

// Chrome/Edge/Android: browser mengirim event ini saat app memenuhi syarat install
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
});

window.addEventListener('appinstalled', () => {
  statusEl.textContent = 'Aplikasi berhasil diinstal! 🎉';
  installBtn.style.display = 'none';
  deferredPrompt = null;
});

installBtn.addEventListener('click', async () => {
  if (deferredPrompt) {
    // Alur normal Chrome/Edge/Android
    deferredPrompt.prompt();
    const result = await deferredPrompt.userChoice;
    if (result.outcome === 'accepted') {
      statusEl.textContent = 'Aplikasi berhasil diinstal! 🎉';
    }
    deferredPrompt = null;
  } else if (isIOS()) {
    // iOS Safari tidak punya prompt otomatis
    statusEl.textContent = 'Di iPhone/iPad: tap ikon Share (□↑) di bawah, lalu pilih "Add to Home Screen".';
  } else {
    statusEl.textContent = 'Gunakan menu browser (⋮) lalu pilih "Install app" / "Add to Home screen".';
  }
});

// ============================================================
// SERVICE WORKER (agar halaman ini bisa diinstal & tampil offline)
// ============================================================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').catch(function(err) {
      console.warn('Service worker gagal didaftarkan:', err);
    });
  });
}
</script>
</body>
</html>
