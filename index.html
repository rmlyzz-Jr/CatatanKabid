<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jadwal Kegiatan - Kabid Bina Marga</title>

<!-- ============ PWA META TAGS ============ -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jadwal Kegiatan">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  }
  body {
    background: linear-gradient(135deg, #1e3a5f 0%, #2f6fed 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .splash { max-width: 340px; }
  .splash img {
    width: 96px;
    height: 96px;
    border-radius: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    margin-bottom: 20px;
  }
  h1 { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
  p.sub { font-size: 13px; opacity: .85; margin-bottom: 28px; }
  .status { font-size: 12.5px; opacity: .8; min-height: 18px; margin-bottom: 20px; }
  .btn-open {
    display: inline-block;
    background: #fff;
    border: 1px solid rgba(255,255,255,0.35);
    color: #1e3a5f;
    padding: 13px 32px;
    border-radius: 24px;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    transition: .2s;
    box-shadow: 0 8px 20px rgba(0,0,0,.2);
  }
  .btn-open:hover { background: #eef1f7; transform: translateY(-1px); }
  .btn-open:active { transform: translateY(0); }
  .install-btn {
    display: none;
    margin-top: 12px;
    background: transparent;
    border: none;
    color: #fff;
    font-size: 12.5px;
    text-decoration: underline;
    cursor: pointer;
    opacity: .85;
  }
  .install-btn.show { display: inline-block; }
</style>
</head>
<body>

<div class="splash">
  <img src="icon-512.png" alt="Jadwal Kegiatan">
  <h1>Jadwal Kegiatan</h1>
  <p class="sub">Kepala Bidang Bina Marga</p>

  <a class="btn-open" id="openBtn" href="https://script.google.com/macros/s/AKfycbyd1lrkh2BYvIpRagMXvpxi8ouzgJ72IAT_oVajb9oASpqccCjdLpuObB_O5YEbbpaqLQ/exec">
    🚀 Buka Aplikasi
  </a>
  <div class="status" id="status"></div>
  <button class="install-btn" id="installBtn">📲 Install ke Home Screen</button>
</div>

<script>
// ============================================================
// KONFIGURASI — GANTI DENGAN URL APLIKASI (APPS SCRIPT) KAMU!
// ============================================================
const APP_URL = 'https://script.google.com/macros/s/AKfycbyd1lrkh2BYvIpRagMXvpxi8ouzgJ72IAT_oVajb9oASpqccCjdLpuObB_O5YEbbpaqLQ/exec';

// ============================================================
// INSTALL PWA (splash ini yang jadi ikon di Home Screen)
// ============================================================
let deferredPrompt;
const installBtn = document.getElementById('installBtn');

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
}
function isIOS() {
  return /iphone|ipad|ipod/i.test(window.navigator.userAgent);
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (!isStandalone()) installBtn.classList.add('show');
});

installBtn.addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.classList.remove('show');
  } else if (isIOS()) {
    document.getElementById('status').textContent =
      'Di iPhone/iPad: tap ikon Share (□↑), lalu "Add to Home Screen"';
  } else {
    document.getElementById('status').textContent =
      'Gunakan menu browser (⋮) lalu "Install app" / "Add to Home screen"';
  }
});

if (isIOS() && !isStandalone()) {
  installBtn.classList.add('show');
}

// Service Worker (agar splash bisa diinstall & dibuka offline sebentar sebelum redirect)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').catch(function(err) {
      console.warn('Service worker gagal didaftarkan:', err);
    });
  });
}
</script>
</body>
</html>
